
<!DOCTYPE html>
<html >
<head>
    <title>Sticky navbar and card overlay using CSS positioning</title>
    <link rel="stylesheet" href="labp8.css">
</head>
<body>

    <nav class="navbar">
        <h2>My Website</h2>

        <div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <main>
        <h1>My Projects</h1>

        <div class="card">
            <div class="image">
                <img src=""
                alt="img">
                <span class="tag">Featured</span>
            </div>

            <h2>Web Development</h2>
            <p>Learning HTML, CSS and JavaScript.</p>
        </div>

        <div class="card">
            <div class="image">
                <img src=""
                alt="Technology">
                <span class="tag">New</span>
            </div>

            <h2>Technology</h2>
            <p>Exploring new technologies.</p>
        </div>
    </main>

</body>
</html>
